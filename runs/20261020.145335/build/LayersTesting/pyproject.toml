[project]
name = "ledger"
version = "0.1.0"
description = "Command-line cash ledger for a small shop."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

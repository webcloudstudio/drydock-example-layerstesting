[project]
name = "ledger"
version = "0.1.0"
description = "Command-line cash ledger."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# persistence/ is generated by Drydock and copied shipped engines; it is not authored here.
extend-exclude = ["persistence"]

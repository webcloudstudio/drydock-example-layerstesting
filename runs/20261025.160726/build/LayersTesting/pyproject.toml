[project]
name = "layerstesting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Anchors pytest's configuration to this project so ancestor configs are not inherited.
testpaths = ["tests"]
# Puts the application root on sys.path so tests import the cli and persistence packages.
pythonpath = ["."]
